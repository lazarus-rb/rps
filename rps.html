<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const selectionDiv = document.createElement("div");
            
            document.body.appendChild(selectionDiv);

            const rockButton = document.createElement("button");
            rockButton.textContent = 'Rock';
            rockButton.classList.add('playerSelection');

            const paperButton = document.createElement("button");
            paperButton.textContent = 'Paper';
            paperButton.classList.add('playerSelection');

            const scissorsButton = document.createElement("button");
            scissorsButton.textContent = 'Scissors';
            scissorsButton.classList.add('playerSelection');

            const gameDescription = document.createElement("div");
            document.body.appendChild(gameDescription);

            selectionDiv.appendChild(rockButton);
            selectionDiv.appendChild(paperButton);
            selectionDiv.appendChild(scissorsButton);
            

            let humanScore = 0;
            let computerScore = 0;

            function getComputerChoice() {
                const choice = Math.random() * 3;
                let choiceStr = '';
                if(choice < 1) {
                    choiceStr = "Rock";
                }
                if (choice > 2) {
                    choiceStr = "Paper";
                }
                else choiceStr = "Scissors";

                return choiceStr;
            }

            
            const playerSelectionButtons = document.querySelectorAll('.playerSelection');
            playerSelectionButtons.forEach(button => {
                button.addEventListener("click", getHumanChoice);
            });

            
            function getHumanChoice(selectedButton) {
                let humanChoice = selectedButton;
                if(humanScore<5 && computerScore<5) {
                    playRound(humanChoice.target.textContent, getComputerChoice());
                }
                else {
                    gameDescription.textContent = 'Game over! Refresh to play again.';
                }
            }

            function playRound(humanChoice, computerChoice) {
                console.log('Computer chose ' + computerChoice + "!");
                console.log('Human chose ' + humanChoice + "!");


                if(humanChoice.toLowerCase() == 'rock') {
                    if(computerChoice.toLowerCase() == 'rock') {
                        console.log("Draw");
                    }
                    if(computerChoice.toLowerCase() == 'paper') {
                        computerScore++;
                        console.log("Computer wins!");
                    }
                    if(computerChoice.toLowerCase() == 'scissors') {
                        humanScore++;
                        console.log("Human wins!");
                    }

                }

                else if(humanChoice.toLowerCase() == 'paper') {
                    if(computerChoice.toLowerCase() == 'paper') {
                        console.log("Draw");
                    }
                    if(computerChoice.toLowerCase() == 'scissors') {
                        computerScore++;
                        console.log("Computer wins!");
                    }
                    if(computerChoice.toLowerCase() == 'rock') {
                        humanScore++;
                        console.log("Human wins!");
                    }
                }
                
                else if(humanChoice.toLowerCase() == 'scissors') {
                    if(computerChoice.toLowerCase() == 'scissors') {
                        console.log("Draw");
                    }
                    if(computerChoice.toLowerCase() == 'rock') {
                        computerScore++;
                        console.log("Computer wins!");
                    }
                    if(computerChoice.toLowerCase() == 'paper') {
                        humanScore++;
                        console.log("Human wins!");
                    }
                }

                let scoreTally = "Human score is: " + humanScore + " Computer score is: " + computerScore;
                gameDescription.textContent = scoreTally;

            }            
        });

    </script>
</head>
<body>
</body>
</html>
